# Local research database. Source of truth during all research phases.
# Supabase is used ONLY for the final read-only hosted demo (CLAUDE.md §7).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: histosearch-db
    environment:
      POSTGRES_USER: histosearch
      POSTGRES_PASSWORD: histosearch
      POSTGRES_DB: histosearch
    ports:
      - "5433:5432"
    volumes:
      - histosearch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U histosearch -d histosearch"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  histosearch_pgdata:
